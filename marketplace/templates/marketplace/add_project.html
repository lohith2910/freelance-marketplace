{% extends "marketplace/base.html" %}

{% block title %}Add Project - FreelanceX{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="panel">
            <div class="eyebrow">Client action</div>
            <h1 class="mb-4">Add New Project</h1>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn-app">Submit Project</button>
                <a href="{% url 'client_dashboard' %}" class="btn-app secondary ms-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
