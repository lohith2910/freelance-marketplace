{% extends "marketplace/base.html" %}

{% block title %}Start - FreelanceX{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="panel text-center">
            <div class="eyebrow">Choose your path</div>
            <h1 class="mb-3">Start using FreelanceX</h1>
            <p class="muted mb-4">Create an account as a client to post projects or as a freelancer to apply and bid.</p>
            <div class="d-flex justify-content-center gap-3 flex-wrap">
                <a href="{% url 'register' %}" class="btn-app">Register</a>
                <a href="{% url 'login' %}" class="btn-app secondary">Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
